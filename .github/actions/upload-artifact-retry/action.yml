name: Upload artifact with a retry
description: >
  FinalizeArtifact 403s from GitHub's blob intermediary are non-retryable inside
  upload-artifact, but a second attempt with overwrite usually lands.
inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: Files to upload
    required: true
runs:
  using: composite
  steps:
    - id: first
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: 90
        if-no-files-found: error
        overwrite: true
    - if: steps.first.outcome == 'failure'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: 90
        if-no-files-found: error
        overwrite: true
