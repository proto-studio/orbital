name: Update V8

# Rebuilds the prebuilt V8 libraries and opens a PR that pins them. The libraries are
# NOT committed: each target is packaged into dist/v8-<goos>-<goarch>.tar.gz, uploaded
# as an Actions artifact, and pinned (by run id + sha256) in
# internal/v8dist/manifest.json. Merging the PR starts release.yml, which publishes
# the pin as a new version.
#
# The glue isn't compiled here. A new V8 version changes the headers it builds against,
# so this calls glue.yml, the same workflow pull requests use for glue changes. This
# is the one place with a V8 checkout, so it packages the headers and glue SDK for it.
#
# Two entry points feed the SAME build->glue->test->ready chain:
#
#   * workflow_dispatch / schedule: `check` detects a newer stable V8 and, if the
#     update branch does not already exist, `open-draft-pr` creates it (bumping V8)
#     and opens a DRAFT PR up front — so a PR always exists even if the
#     build or tests then fail. The initial build runs in this same run (a branch
#     push made with GITHUB_TOKEN does not itself trigger the push event below).
#
#   * push to automated/update-v8-**: when a developer clones the PR branch, fixes
#     whatever broke the build/tests, and pushes, this reruns build + test and
#     uploads fresh artifacts + a re-pinned manifest attached to that same PR.
#
# `open-draft-pr` is create-only (guarded on branch-existence) so re-dispatching
# never resets a branch that carries a developer's fixes. The manifest is re-pinned
# on every build, so it always names the most recent run — which is exactly the run
# release.yml pulls the artifacts from.
#
# Build model: V8's Linux clang (Chromium's bundled toolchain) is an x86_64 binary
# that cross-compiles arm64, so ALL Linux libraries are built on x64 runners. macOS
# builds run natively on Apple Silicon. Intel macOS (darwin-amd64) is intentionally
# unsupported: current V8 requires the macOS 15+ SDK (arm64 macos-15 runners only).
on:
  workflow_dispatch:
  push:
    branches: ['automated/update-v8-**']
  schedule:
    # One Monday run. 08:00 UTC is 04:00 EDT / 03:00 EST — early enough that a
    # ~2h build is done well before 09:00 ET. GitHub cron is UTC-only (no DST
    # timezone); do not add a second EST offset or both fire every week and
    # the later one cancels this compile.
    - cron: '0 8 * * 1'

permissions:
  contents: write
  pull-requests: write
  # upload-artifact FinalizeArtifact and gh run download both use the actions API.
  actions: write

concurrency:
  # Push: one in-flight build per update branch; a newer push cancels the last.
  # Schedule: never cancel. A later dispatch (or any other run on main) is the
  # extra — it must not kill the Monday compile.
  # Dispatch: latest dispatch of the same ref wins.
  group: ${{ github.event_name == 'schedule' && format('update-v8-schedule-{0}', github.run_id) || format('update-v8-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # ---------------------------------------------------------------------------
  # DISPATCH/SCHEDULE ONLY: detect a newer stable V8, compute the branch name, and
  # note whether that branch already exists.
  # ---------------------------------------------------------------------------
  check:
    name: Check for new V8
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.detect.outputs.latest }}
      current: ${{ steps.detect.outputs.current }}
      changed: ${{ steps.detect.outputs.changed }}
      branch: ${{ steps.branch.outputs.branch }}
      branch_exists: ${{ steps.branch.outputs.branch_exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Detect latest stable V8
        id: detect
        run: |
          latest="$(bash scripts/latest-v8-version.sh)"
          current="$(grep -E '^V8_VERSION :=' Makefile | sed -E 's/^V8_VERSION := *//')"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          # sort -V: only bump when Chromium-stable is strictly newer. A
          # recently published patch on an older milestone must not downgrade.
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already on latest stable V8 ($current)."
          elif [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" = "$latest" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New V8 available: $current -> $latest"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Pinned V8 $current is newer than Chromium-stable $latest; not downgrading."
          fi

      - name: Compute branch
        id: branch
        run: |
          branch="automated/update-v8-${{ steps.detect.outputs.latest }}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
            echo "Branch $branch already exists — will rebuild it, not recreate."
          else
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Branch: $branch"

  # ---------------------------------------------------------------------------
  # DISPATCH/SCHEDULE ONLY, create-only: bump V8, push a new branch, and open a DRAFT PR. Skipped if the branch already exists so a
  # developer's pushed fixes are never clobbered.
  # ---------------------------------------------------------------------------
  open-draft-pr:
    name: Open draft PR
    needs: check
    if: github.event_name != 'push' && needs.check.outputs.changed == 'true' && needs.check.outputs.branch_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump pinned V8
        env:
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          sed -i -E "s/^V8_VERSION := .*/V8_VERSION := ${LATEST}/" Makefile
          sed -i -E "s/(V8_VERSION:-)[0-9][0-9.]*/\1${LATEST}/" scripts/build-v8.sh
          sed -i -E "s|(<!-- V8_VERSION -->).*(<!-- /V8_VERSION -->)|\1${LATEST}\2|" README.md

      - name: Create draft PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ needs.check.outputs.branch }}
          draft: true
          commit-message: "Update V8 to ${{ needs.check.outputs.latest }}"
          title: "Update V8 to ${{ needs.check.outputs.latest }}"
          body: |
            Automated V8 update — building the libraries.

            - V8: `${{ needs.check.outputs.current }}` -> `${{ needs.check.outputs.latest }}`

            This PR is a **draft** while the per-target libraries build. When the
            build finishes, `internal/v8dist/manifest.json` is committed (pinning
            the build run id + sha256 of each `v8-<target>.tar.gz`), the `test`
            job tests the exact artifacts on native runners, and the PR is marked
            ready. Merging publishes it as a patch release, through the Release workflow.

            **If the build or tests fail:** clone this branch, fix the issue, and
            push. That reruns build + test and re-pins the manifest on this PR.
          add-paths: |
            Makefile
            scripts/build-v8.sh
            README.md

  # ---------------------------------------------------------------------------
  # Shared resolver for BOTH triggers: settle the ref to build and read the
  # pinned V8 version off that ref. Everything downstream keys off these
  # outputs, so build/glue/test are identical for a dispatch and a
  # developer push.
  # ---------------------------------------------------------------------------
  setup:
    name: Resolve build parameters
    needs: [check, open-draft-pr]
    if: >
      always() &&
      ( github.event_name == 'push' ||
        ( needs.check.result == 'success' &&
          needs.check.outputs.changed == 'true' &&
          ( needs.open-draft-pr.result == 'success' || needs.open-draft-pr.result == 'skipped' ) ) )
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.p.outputs.ref }}
      v8_version: ${{ steps.p.outputs.v8_version }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || needs.check.outputs.branch }}

      - name: Read pinned version
        id: p
        run: |
          ref="${{ github.event_name == 'push' && github.ref_name || needs.check.outputs.branch }}"
          v8="$(grep -E '^V8_VERSION :=' Makefile | sed -E 's/^V8_VERSION := *//')"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "v8_version=$v8" >> "$GITHUB_OUTPUT"
          echo "Building ref=$ref  V8=$v8"

  # ---------------------------------------------------------------------------
  # Fetch V8 source once; all platform builds share this cache.
  # ---------------------------------------------------------------------------
  fetch-v8:
    name: Fetch V8 source
    needs: setup
    # setup uses always(), so downstream jobs must carry a status-check function
    # (!cancelled()) or the skipped check/open-draft-pr ancestors propagate a skip.
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.ref }}

      # One rolling source cache, warm-started across versions. A new V8 version
      # misses the exact key, but the `v8-src-` restore-key restores the most
      # recent prior checkout (any version) — so a new version is NEVER a cold
      # clone: v8-fetch does an incremental git fetch + checkout + gclient sync on
      # top of it, and the result is saved under the new version's key. The old
      # entry becomes redundant and ages out via GitHub's LRU. (Caches are
      # immutable and an exact-key hit skips the post-run save, so the key must
      # advance with the version to keep the saved cache fresh.)
      - name: Cache V8 source (shared across platforms)
        uses: actions/cache@v4
        with:
          path: |
            v8-build/v8
            v8-build/.gclient
            v8-build/.gclient_entries
          key: v8-src-${{ needs.setup.outputs.v8_version }}
          restore-keys: |
            v8-src-

      - name: Install fetch dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 curl

      - name: Fetch V8 source
        run: make v8-fetch V8_VERSION="${{ needs.setup.outputs.v8_version }}" NUM_JOBS=4

  # ---------------------------------------------------------------------------
  # Build + package each target's V8 libraries into dist/v8-<goos>-<goarch>.tar.gz
  # and upload them as base-v8-<goos>-<goarch>. glue.yml adds the glue to these.
  # ---------------------------------------------------------------------------
  build:
    name: Build V8 (${{ matrix.platform }})
    needs: [setup, fetch-v8]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.fetch-v8.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runs-on: ubuntu-latest
            v8arch: x64
          - platform: linux-arm64
            runs-on: ubuntu-latest        # cross-compiled from x64
            v8arch: arm64
          - platform: darwin-arm64
            runs-on: macos-15              # arm64 + macOS 15 SDK (required by V8)
            v8arch: arm64
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 150
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 5G
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - name: Derive target
        id: t
        run: |
          platform="${{ matrix.platform }}"
          echo "os=${platform%-*}" >> "$GITHUB_OUTPUT"
          echo "arch=${platform##*-}" >> "$GITHUB_OUTPUT"

      # Exact hit on the source cache that fetch-v8 saved this run (same version);
      # the prefix restore-key is a fallback. The exact hit means this job never
      # re-saves the (large) source cache.
      - name: Restore shared V8 source
        uses: actions/cache@v4
        with:
          path: |
            v8-build/v8
            v8-build/.gclient
            v8-build/.gclient_entries
          key: v8-src-${{ needs.setup.outputs.v8_version }}
          restore-keys: |
            v8-src-

      - name: Install V8 build toolchain (Linux)
        if: startsWith(matrix.platform, 'linux-')
        run: bash scripts/ci-install-linux-toolchain.sh

      - name: Install sccache
        run: bash scripts/ci-install-sccache.sh

      # Content-addressed compile cache. Unlike caching out.gn, sccache keys each
      # object by preprocessed source + compiler flags, so it is immune to the
      # gclient-sync mtime churn and gn-gen reruns that force ninja to "recompile"
      # everything. run_id in the key means we always save a fresh, growing cache;
      # the prefix restore-key warm-starts from the most recent previous build.
      - name: Restore sccache (${{ matrix.platform }})
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: v8-sccache-${{ matrix.platform }}-${{ needs.setup.outputs.v8_version }}-${{ github.run_id }}
          restore-keys: |
            v8-sccache-${{ matrix.platform }}-${{ needs.setup.outputs.v8_version }}-
            v8-sccache-${{ matrix.platform }}-

      # A stale out.gn baked into the source cache would make V8's landmines
      # gclient hook clobber on sync. We build from a clean out.gn every run
      # (sccache makes that cheap), so just remove it before syncing.
      - name: Drop any build dir carried in the source cache
        run: rm -rf v8-build/v8/out.gn

      - name: Fetch + sync V8 (runs hooks)
        run: make v8-fetch V8_VERSION="${V8_VERSION}" NUM_JOBS=4
        env:
          V8_VERSION: ${{ needs.setup.outputs.v8_version }}

      - name: Reset sccache stats
        run: sccache --zero-stats || true

      - name: Build + package V8 (no re-fetch; sccache compile cache)
        run: make v8-build V8_BUILD_PREREQ= V8_BUILD_GLUE=0 CC_WRAPPER=sccache TARGET_OS="${{ steps.t.outputs.os }}" TARGET_ARCH="${{ steps.t.outputs.arch }}" V8_VERSION="${V8_VERSION}" NUM_JOBS=4
        env:
          V8_VERSION: ${{ needs.setup.outputs.v8_version }}

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Package the glue SDK
        run: bash scripts/package-glue-sdk.sh "${{ matrix.platform }}"

      - name: Upload packaged artifact
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: base-v8-${{ matrix.platform }}
          path: |
            dist/v8-${{ matrix.platform }}.tar.gz
            dist/v8-${{ matrix.platform }}.tar.gz.sha256

      - name: Upload glue SDK
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: base-v8-glue-sdk-${{ matrix.platform }}
          path: |
            dist/v8-glue-sdk-${{ matrix.platform }}.tar.gz
            dist/v8-glue-sdk-${{ matrix.platform }}.tar.gz.sha256

      - name: Upload V8 headers
        if: matrix.platform == 'linux-amd64'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: base-v8-headers
          path: |
            dist/v8-headers.tar.gz
            dist/v8-headers.tar.gz.sha256

  # ---------------------------------------------------------------------------
  # Compile the glue against this V8, package it with the libraries built above,
  # and commit a manifest that pins them. Because this is re-pinned on every build,
  # the committed manifest always names the MOST RECENT run.
  # ---------------------------------------------------------------------------
  glue:
    name: Glue
    needs: [setup, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/glue.yml
    with:
      branch: ${{ needs.setup.outputs.ref }}
      base_run_id: ${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # Test the freshly built artifacts on NATIVE runners, exactly the way a consumer
  # installs them. Runs after the manifest is pinned so the embedded sha256s match
  # what this run produced.
  # ---------------------------------------------------------------------------
  test:
    name: Test
    needs: glue
    if: ${{ !cancelled() && needs.glue.result == 'success' }}
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.glue.outputs.sha }}
      run_id: ${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # Mark the PR ready once every target passed. If any build/test job
  # failed the PR simply stays a draft (it was already created up front). On a
  # developer push that re-greens the PR, this re-marks it ready (idempotent).
  # ---------------------------------------------------------------------------
  ready:
    name: Mark PR ready
    needs: [setup, glue, test]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Mark PR ready for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh pr ready "${{ needs.setup.outputs.ref }}" || echo "PR already ready (or none to mark)."
      # GitHub doesn't start other workflows for a pull request opened with GITHUB_TOKEN, so the Tests and
      # Change link checks can't run on this one. This reports them instead, only for the exact commit tested above. If the
      # pull request has moved on, the newer commit gets its own run, and its own report if it passes.
      - name: Report as a standard change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ needs.setup.outputs.ref }}
          VALIDATED: ${{ needs.glue.outputs.sha }}
        run: |
          case "$REF" in
            automated/update-v8-*) ;;
            *) echo "Not an automated V8 branch, so nothing to report."; exit 0 ;;
          esac
          pr=$(gh pr view "$REF" --json number,headRefOid --jq '"\(.number) \(.headRefOid)"') || { echo "No pull request to mark."; exit 0; }
          number=${pr% *}
          head=${pr#* }
          if [ "$head" != "$VALIDATED" ]; then
            echo "Pull request moved from $VALIDATED to $head, so nothing to report."
            exit 0
          fi
          gh api "repos/$GH_REPO/issues/$number/labels" -f "labels[]=standard-change" > /dev/null
          for context in Tests "Change link"; do
            gh api "repos/$GH_REPO/statuses/$VALIDATED" -f state=success -f context="$context" -f description="Automated V8 update that passed validation" > /dev/null
          done
