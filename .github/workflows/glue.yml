name: Build glue

# Compiles libv8go_glue.a for every target, packages it with the V8 libraries into
# the v8-<goos>-<goarch>.tar.gz artifacts, and commits a manifest that pins them.
# release.yml later publishes whatever the manifest on main pins.
#
# ci.yml calls this for a pull request that changes the glue. update-v8.yml calls it
# for a new V8 version, since the glue has to compile against the new headers; it
# can't leave that to ci.yml because a pull request opened with GITHUB_TOKEN doesn't
# start other workflows.
#
# This needs no V8 checkout. The headers and the glue SDK (V8's compile command and
# libc++ headers) are pinned artifacts, and scripts/install-glue-sdk.sh downloads V8's
# own clang and sysroot, so the glue is compiled exactly as a V8 build would compile it.
on:
  workflow_call:
    inputs:
      branch:
        description: Branch to build, and to commit the pinned manifest to
        type: string
        required: true
      base_run_id:
        description: Run with base-v8-<platform> artifacts to use instead of the V8 libraries the manifest pins
        type: string
        default: ""
    outputs:
      sha:
        description: The commit with the pinned manifest
        value: ${{ jobs.pin.outputs.sha }}

permissions:
  contents: read

jobs:
  build:
    name: Build glue (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runs-on: ubuntu-latest
          - platform: linux-arm64
            runs-on: ubuntu-latest        # cross-compiled from x64
          - platform: darwin-arm64
            runs-on: macos-15
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Derive target
        id: t
        run: |
          platform="${{ matrix.platform }}"
          {
            echo "os=${platform%-*}"
            echo "arch=${platform##*-}"
            echo "v8=$(sed -nE 's/^V8_VERSION := *//p' Makefile)"
          } >> "$GITHUB_OUTPUT"

      - name: Install the glue SDK and V8 headers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/install-glue-sdk.sh "${{ matrix.platform }}" "${{ inputs.base_run_id }}"

      - name: Build glue
        run: make v8-glue V8_VERSION="${{ steps.t.outputs.v8 }}" TARGET_OS="${{ steps.t.outputs.os }}" TARGET_ARCH="${{ steps.t.outputs.arch }}"

      - name: Package with the V8 libraries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/ci-package-glue.sh "${{ matrix.platform }}" "${{ inputs.base_run_id }}"

      - name: Upload packaged artifact
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: v8-${{ matrix.platform }}
          path: |
            dist/v8-${{ matrix.platform }}.tar.gz
            dist/v8-${{ matrix.platform }}.tar.gz.sha256

      - name: Upload glue SDK
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: v8-glue-sdk-${{ matrix.platform }}
          path: |
            dist/v8-glue-sdk-${{ matrix.platform }}.tar.gz
            dist/v8-glue-sdk-${{ matrix.platform }}.tar.gz.sha256

      # Public headers for glue rebuilds. The same on every platform.
      - name: Upload V8 headers
        if: matrix.platform == 'linux-amd64'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: v8-headers
          path: |
            dist/v8-headers.tar.gz
            dist/v8-headers.tar.gz.sha256

  pin:
    name: Pin artifacts in manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Download packaged artifacts
        run: |
          for platform in linux-amd64 linux-arm64 darwin-arm64; do
            gh run download "$GITHUB_RUN_ID" -n "v8-$platform" -D dist
            gh run download "$GITHUB_RUN_ID" -n "v8-glue-sdk-$platform" -D dist
          done
          gh run download "$GITHUB_RUN_ID" -n v8-headers -D dist
          cd dist
          for f in *.tar.gz.sha256; do
            shasum -a 256 -c "$f"
          done

      # release.yml checks source_commit against the run's head commit. On a pull
      # request that isn't GITHUB_SHA, which is a temporary merge commit.
      - name: Assemble manifest
        run: |
          make v8-manifest \
            V8_VERSION="$(sed -nE 's/^V8_VERSION := *//p' Makefile)" \
            MODULE_VERSION="$(jq -r .module_version internal/v8dist/manifest.json)" \
            SOURCE_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .head_sha)" \
            SOURCE_RUN_ID="$GITHUB_RUN_ID" \
            OWNER="${GITHUB_REPOSITORY%/*}" \
            REPO="${GITHUB_REPOSITORY#*/}"
          cat internal/v8dist/manifest.json

      # Pushed with GITHUB_TOKEN, which starts no other workflows, so this never
      # triggers another build. Callers test and report on this commit themselves.
      - name: Commit manifest to branch
        id: commit
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add internal/v8dist/manifest.json
          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "Pin V8 artifacts (run $GITHUB_RUN_ID) in manifest"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
